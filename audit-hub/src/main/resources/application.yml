server:
  port: ${PORT:8084}

spring:
  application:
    name: audit-hub

services:
  inventory:
    url: ${INVENTORY_URL:http://localhost:8081}
  orders:
    url: ${ORDERS_URL:http://localhost:8082}
  payments:
    url: ${PAYMENTS_URL:http://localhost:8083}

audit:
  known-services: inventory,orders,payments

logging:
  level:
    dev.jenilarper.proxy: INFO
